<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zangband</title>
<style>
	:root { color-scheme: dark; }
	html, body { margin: 0; height: 100%; background: #000; color: #bbb;
		font: 14px/1.4 system-ui, sans-serif; }
	body { display: flex; flex-direction: column; }
	#wrap { flex: 1; min-height: 0; display: flex; align-items: center;
		justify-content: center; overflow: hidden; padding: 8px; }
	#term { display: block; image-rendering: pixelated; outline: none; }
	#term.bell { animation: bell 0.15s; }
	@keyframes bell { from { filter: brightness(2); } to { filter: none; } }
	footer { padding: 6px 12px; font-size: 12px; color: #777; text-align: center; }
	#tiles { font: inherit; background: #111; color: #ccc; border: 1px solid #444; }
	kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 0 4px; color: #ccc; }
	#status, #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
		align-items: center; justify-content: center; gap: 8px; font-size: 18px; }
	#overlay { background: rgba(0, 0, 0, 0.8); }
	#overlay button { font: inherit; padding: 6px 16px; cursor: pointer; }
	[hidden] { display: none !important; }
	#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
		background: #400; color: #fcc; padding: 8px 14px; border-radius: 4px; max-width: 90vw; }
</style>
</head>
<body>
<div id="wrap"><canvas id="term" tabindex="0"></canvas></div>
<footer>
	<label>Tiles: <select id="tiles"></select></label> &middot;
	<label><input type="checkbox" id="sound"> Sound</label> &middot;
	Arrow keys / numpad move, <kbd>Shift</kbd>+arrow runs, <kbd>?</kbd> for commands.
	<kbd>Ctrl</kbd>+<kbd>S</kbd> saves (to this browser), <kbd>Ctrl</kbd>+<kbd>X</kbd> saves and quits.
</footer>
<div id="status">Loading…</div>
<div id="overlay" hidden></div>
<div id="toast" hidden></div>
<script>
/*
 * @VERSION@ is filled in by web/build.sh with a hash of the build.  All
 * the game's files are fetched with it, so a browser or proxy that has
 * cached one of them can never pair it with a file from another build.
 * (This must be set before zangband.js runs: it fetches zangband.data first.)
 */
var Module = {
	zangbandVersion: '@VERSION@',
	locateFile: function (path, prefix) {
		return (prefix || '') + path + '?v=' + Module.zangbandVersion;
	}
};
</script>
<script async src="zangband.js?v=@VERSION@"></script>
</body>
</html>
