# sound.cfg
#
# Configuration file for the Angband sound events
#
# The format is:
# name of the Angband event = list of the available sample-names seperated by spaces.
#
# Example:
# hit = hit.wav hit1.wav
#
# Look at the definition of "angband_sound_name" in variable.c for a complete list of
# all the available event names.
#
# The samples are the Dubtrain Angband sound set (v3.1.0, www.dubtrain.com/angband,
# Creative Commons non-commercial licence), as shipped with ZangbandTK 3.121.0.
# Each Zangband event is given the samples ZangbandTK uses for the nearest of its
# own events (lib/customize/sound.prf there).
#
# On Linux/Unix, run with -v.  The samples are played by the program named in
# $ANGBAND_SOUND_PLAYER, or else the first of mpg123, ffplay, mpv, pw-play or
# paplay found on the PATH.

